name: Auth Service CI

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/auth-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Show Java and Maven versions
        run: |
          java -version
          bash mvnw --version

      - name: Build and run tests
        run: bash mvnw --batch-mode --no-transfer-progress verify
