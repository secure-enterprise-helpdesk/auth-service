name: Deploy Auth Service to local Kind

on:
  push:
    branches: [dev]
    paths: ["src/**", "pom.xml", "Dockerfile", ".dockerignore", ".mvn/**", "mvnw", "mvnw.cmd"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-kind-auth-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, helpdesk-kind]
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Docker and Kubernetes context
        shell: pwsh
        run: |
          docker info --format '{{.ServerVersion}}'
          if ($LASTEXITCODE -ne 0) { throw "Docker engine is unavailable." }
          $context = (kubectl config current-context).Trim()
          if ($LASTEXITCODE -ne 0 -or $context -ne "kind-helpdesk") {
            throw "kubectl context must be kind-helpdesk; found '$context'."
          }
      - name: Build image
        shell: pwsh
        run: |
          docker build -t secureaienterprisehelpdesk-auth-service:dev-20261024 .
          if ($LASTEXITCODE -ne 0) { throw "Auth Service image build failed." }
      - name: Load image into Kind
        shell: pwsh
        run: |
          kind load docker-image secureaienterprisehelpdesk-auth-service:dev-20261024 --name helpdesk
          if ($LASTEXITCODE -ne 0) { throw "Could not load the Auth Service image." }
      - name: Roll out Auth Service
        shell: pwsh
        run: |
          kubectl rollout restart deployment/auth-service -n helpdesk
          if ($LASTEXITCODE -ne 0) { throw "Could not restart Auth Service." }
          kubectl rollout status deployment/auth-service -n helpdesk --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw "Auth Service rollout failed." }
